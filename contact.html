<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact – The Storybook Play Cafe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --forest:#214033; --deep:#162a22; --moss:#5f8a6d; --moss2:#4d7a5f;
      --gold:#f3d58b; --paper:#fbf7ef; --paper2:#f4eddc; --ink:#1f2b22; --muted:#4a5a50;
      --radius:22px; --shadow: 0 10px 28px rgba(0,0,0,.10);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; color:var(--ink); line-height:1.55;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(243,213,139,.40), transparent 60%),
        radial-gradient(900px 520px at 85% 10%, rgba(95,138,109,.28), transparent 55%),
        linear-gradient(180deg, #fbfbf7 0%, #f4f7f0 50%, #eef3ee 100%);
    }
    .navWrap{ position:sticky; top:0; z-index:50; backdrop-filter: blur(10px);
      background: rgba(22,42,34,.72); border-bottom:1px solid rgba(255,255,255,.10); }
    .nav{ max-width:1040px; margin:0 auto; padding:.9rem 1rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; color:#fff; }
    .brand{ display:flex; align-items:center; gap:.65rem; font-weight:800; letter-spacing:.2px; font-family: Georgia, serif; }
    .acorn{ width:14px;height:14px;border-radius:999px; background:var(--gold); box-shadow:0 0 0 6px rgba(243,213,139,.18); }
    .links a{ color:#fff; text-decoration:none; opacity:.92; margin-left:.9rem; font-weight:600; }
    .links a:hover{ opacity:1; text-decoration:underline; text-underline-offset:6px; }

    .wrap{ max-width:820px; margin:0 auto; padding:1.5rem 1rem 3rem; }
    .panel{
      background: linear-gradient(180deg, var(--paper), var(--paper2));
      border-radius: var(--radius);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: var(--shadow);
      padding: 1.4rem;
    }
    h1{ margin:.2rem 0 0; font-family: Georgia, serif; color:var(--forest); font-size: clamp(1.7rem, 6vw, 2.2rem); }
    p{ color:var(--muted); }
    label{ display:block; margin-top:1rem; font-weight:800; color:var(--deep); }
    input, textarea{
      width:100%; margin-top:.4rem; padding:.95rem 1rem;
      border-radius: 16px; border:1px solid rgba(0,0,0,.14); background: rgba(255,255,255,.65);
      font-size: 1rem;
    }
    textarea{ min-height: 140px; }
    .btn{
      width:100%; margin-top:1.2rem; padding:1rem 1.2rem; border:none; border-radius:999px;
      background: linear-gradient(180deg, var(--moss), var(--moss2));
      color:#fff; font-weight:900; font-size: 1rem;
      box-shadow: 0 14px 30px rgba(0,0,0,.12);
    }
    .hint{ margin-top:1rem; font-size:.95rem; }
  </style>
</head>
<body>
  <div class="navWrap">
    <div class="nav">
      <div class="brand"><span class="acorn" aria-hidden="true"></span> The Storybook Play Cafe</div>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </div>

  <main class="wrap">
    <section class="panel">
      <h1>Contact Us</h1>
      <p>Send us a message and we’ll get back to you as soon as we can.</p>

      <!-- Replace YOUR_FORM_ID when you set Formspree up -->
      <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <label>Your name</label>
        <input name="name" required />

        <label>Email</label>
        <input type="email" name="email" required />

        <label>Message</label>
        <textarea name="message" required></textarea>

        <button class="btn" type="submit">Send message ✨</button>
      </form>

      <p class="hint"><strong>Email:</strong> info@thestorybookplaycafe.co.uk</p>
    </section>
  </main>
</body>
</html>
