<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact – The Storybook Play Cafe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Magical fantasy fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Fondamento&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --forest:#214033;
      --deep:#162a22;
      --moss:#5f8a6d;
      --gold:#f3d58b;

      --paper:#fff7ea;
      --paper2:#f5ead3;

      --ink:#1f2b22;
      --muted:#43554b;

      --radius:26px;
      --shadow: 0 18px 50px rgba(0,0,0,.16);
      --shadow2: 0 10px 28px rgba(0,0,0,.12);
    }

    *{ box-sizing:border-box; }
    body{
  margin:0;
  color:#fff;
  background:
    linear-gradient(rgba(10,25,15,.15), rgba(10,25,15,.15)),
    url("images/file_00000000e96471f491c60ac828a1dcfc.png") center / cover no-repeat fixed;
  overflow-x:hidden;
}

    .magicOverlay{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(circle at 10% 14%, rgba(255,255,210,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 32% 24%, rgba(255,255,210,.7) 0 1.7px, transparent 3px),
        radial-gradient(circle at 72% 18%, rgba(255,255,210,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 88% 52%, rgba(255,255,210,.6) 0 2px, transparent 3px),
        radial-gradient(circle at 18% 70%, rgba(255,255,255,.7) 0 1.5px, transparent 3px),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,.65) 0 1.6px, transparent 3px);
      opacity:.42;
      animation: drift 10s ease-in-out infinite alternate;
    }
    @keyframes drift{ from{ transform:translateY(0);} to{ transform:translateY(-18px);} }

    /* Nav */
  .nav{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:.8rem;
  padding:1.4rem 1.2rem;
  background:transparent;
  box-shadow:none;
  border:none;
}
    .brand{
  font-family:"Fondamento", cursive;
  font-size:1.25rem;
  display:flex;
  align-items:center;
  gap:.55rem;
  letter-spacing:.2px;
  font-weight:400;
    
}
    .brand{
  color:#fff;
  text-decoration:none;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

.brand:link,
.brand:visited,
.brand:hover,
.brand:active{
  color:#fff;
  text-decoration:none;
}
    }
    .brand .orb{
      width:12px;height:12px;border-radius:999px;
      background:var(--gold);
      box-shadow:0 0 0 7px rgba(243,213,139,.18), 0 0 18px rgba(243,213,139,.25);
    }
    nav a{
      color:#fff; text-decoration:none; margin-left:.9rem;
      font-weight:700; opacity:.95;
    }
    nav a:hover{ opacity:1; text-decoration:underline; text-underline-offset:6px; }

    .wrap{ max-width:900px; margin:0 auto; padding: 0 1rem; position:relative; z-index:1; }

    .pageHero{
      padding: 2.2rem 0 1.2rem;
      text-align:center;
    }
    .pageTitle{
  color:#fff;
  text-shadow:0 4px 12px rgba(0,0,0,.7);
}

.subtitle{
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
}

    .card{
  background: transparent;
  border-radius: var(--radius);
  padding: 1.65rem;
  box-shadow: none;
  border: none;
  position: relative;
  overflow: hidden;
  margin: 1rem 0 2rem;
}
    .card:before{
  display:none;
  content:none;
}

    .arched{
      width: min(560px, 100%);
      height: 120px;
      margin: -10px auto 0;
      display:block;
    }
    .arched text{
  fill:#fff;
}
    .arched .glow{
  filter: drop-shadow(0 10px 14px rgba(0,0,0,.2));
  font-size: 32px;
}

    .copy,
label,
.card p{
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
}

    label{ display:block; margin-top: 1rem; font-weight:900; color: var(--deep); }
    input,
textarea{
  background: rgba(255,255,255,.9);
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 18px;
  color:#1f2a24;
}
    textarea{ min-height: 150px; }

    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:.55rem;
      width:100%;
      margin-top: 1.2rem;
      padding: 1rem 1.2rem;
      border-radius: 999px;
      text-decoration:none;
      font-weight:900;
      border:1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, var(--moss), #4c735a);
      color:#fff;
      box-shadow: 0 16px 32px rgba(0,0,0,.10);
      cursor:pointer;
    }

    .emailLine{
      margin-top: 1rem;
      font-family:"Fondamento", cursive;
      font-size: 1.25rem;
      color: var(--deep);
    }

    footer{
      text-align:center;
      padding: 2rem 1rem 2.6rem;
      opacity:.82;
      font-size:.95rem;
      font-family:"Fondamento", cursive;
      position:relative;
      z-index:1;
    }
    label{
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
    }
    .card strong,
.card h3,
.card p{
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
}
    .copy{
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
    }
  </style>
</head>

<body>
  <div class="magicOverlay" aria-hidden="true"></div>

  <div class="nav">
    <div class="brand"><span class="orb" aria-hidden="true"></span> The Storybook Play Cafe</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="https://bookwhen.com/thestorybookplaycafe48" target="_blank" rel="noopener">Booking</a>
      <a href="events.html">Events</a>
      <a href="parties.html">Parties</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <div class="wrap">
    <section class="pageHero">
      <h1 class="pageTitle">Contact</h1>
      <p class="subtitle">Send a little message spell… we’ll reply as soon as we can.</p>
    </section>

    <section class="card">
      <svg class="arched" viewBox="0 0 500 120" aria-label="Send us a message">
        <path id="curveC1" d="M 50 90 Q 250 10 450 90" fill="transparent"></path>
        <text class="glow">
          <textPath href="#curveC1" startOffset="50%" text-anchor="middle">
            Send a Message 🧚
          </textPath>
        </text>
      </svg>

      <p class="copy">
        If you’d like updates, have a question, or want to say hello — pop us a message below.
      </p>

      <form action="https://formspree.io/f/mjgjrwzp" method="POST">
        <input type="hidden" name="_subject" value="New message from Storybook Play Cafe">
        <label>Your name</label>
        <input name="name" required />

        <label>Email</label>
        <input type="email" name="email" required />

        <label>Message</label>
        <textarea name="message" required></textarea>

        <button class="btn" type="submit">Send message ✨</button>
      </form>

      <div class="emailLine">
        Or email us: <strong>thestorybookplaycafe@outlook.com</strong>
      </div>
    </section>
  </div>

  <footer>© The Storybook Play Cafe</footer>
</body>
</html>
