<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact – The Storybook Play Cafe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Magical fantasy fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Fondamento&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --forest:#214033;
      --deep:#162a22;
      --moss:#5f8a6d;
      --gold:#f3d58b;

      --paper:#fff7ea;
      --paper2:#f5ead3;

      --ink:#1f2b22;
      --muted:#43554b;

      --radius:26px;
      --shadow: 0 18px 50px rgba(0,0,0,.16);
      --shadow2: 0 10px 28px rgba(0,0,0,.12);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Nunito", sans-serif;
      color:var(--ink);
      line-height:1.65;
      background:
        radial-gradient(1200px 800px at 20% 0%, rgba(243,213,139,.42), transparent 60%),
        radial-gradient(900px 520px at 85% 10%, rgba(95,138,109,.26), transparent 55%),
        radial-gradient(900px 520px at 50% 95%, rgba(33,64,51,.12), transparent 60%),
        linear-gradient(180deg, #fbfbf7 0%, #f4f7f0 50%, #eef3ee 100%);
      overflow-x:hidden;
    }

    .magicOverlay{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(circle at 10% 14%, rgba(255,255,210,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 32% 24%, rgba(255,255,210,.7) 0 1.7px, transparent 3px),
        radial-gradient(circle at 72% 18%, rgba(255,255,210,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 88% 52%, rgba(255,255,210,.6) 0 2px, transparent 3px),
        radial-gradient(circle at 18% 70%, rgba(255,255,255,.7) 0 1.5px, transparent 3px),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,.65) 0 1.6px, transparent 3px);
      opacity:.42;
      animation: drift 10s ease-in-out infinite alternate;
    }
    @keyframes drift{ from{ transform:translateY(0);} to{ transform:translateY(-18px);} }

    /* Nav */
    .nav{
      position:sticky; top:0; z-index:50;
      background:rgba(22,42,34,.78);
      backdrop-filter: blur(8px);
      border-bottom:1px solid rgba(255,255,255,.10);
      padding:.9rem 1rem;
      display:flex; justify-content:space-between; align-items:center;
      color:#fff;
    }
    .brand{
  font-family:"Fondamento", cursive;
  font-size:1.25rem;
  display:flex;
  align-items:center;
  gap:.55rem;
  letter-spacing:.2px;
  font-weight:400;
}
    }
    .brand .orb{
      width:12px;height:12px;border-radius:999px;
      background:var(--gold);
      box-shadow:0 0 0 7px rgba(243,213,139,.18), 0 0 18px rgba(243,213,139,.25);
    }
    nav a{
      color:#fff; text-decoration:none; margin-left:.9rem;
      font-weight:700; opacity:.95;
    }
    nav a:hover{ opacity:1; text-decoration:underline; text-underline-offset:6px; }

    .wrap{ max-width:900px; margin:0 auto; padding: 0 1rem; position:relative; z-index:1; }

    .pageHero{
      padding: 2.2rem 0 1.2rem;
      text-align:center;
    }
    .pageTitle{
      font-family:"Uncial Antiqua", serif;
      font-size: clamp(2rem, 6.6vw, 2.8rem);
      margin: .3rem 0 0;
      color: var(--forest);
      letter-spacing:.5px;
      text-shadow: 0 12px 22px rgba(0,0,0,.10);
    }
    .subtitle{
      margin:.9rem auto 0;
      max-width: 64ch;
      color: var(--muted);
      font-family:"Fondamento", cursive;
      font-size: 1.25rem;
    }

    .card{
      background: linear-gradient(180deg, var(--paper), var(--paper2));
      border-radius: var(--radius);
      padding: 1.65rem;
      box-shadow: var(--shadow2);
      border: 1px solid rgba(0,0,0,.09);
      position:relative;
      overflow:hidden;
      margin: 1rem 0 2rem;
    }
    .card:before{
      content:"";
      position:absolute; inset:auto -22px -22px auto;
      width: 190px; height: 190px; opacity:.26;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><path d='M210 190c-55-10-78-33-88-88 55 10 78 33 88 88z' fill='%23214033'/><path d='M170 210c-35-7-49-21-56-56 35 7 49 21 56 56z' fill='%235f8a6d'/><path d='M210 135c-48 0-75-15-97-52 48 0 75 15 97 52z' fill='%23f3d58b'/></svg>");
      background-size: cover; pointer-events:none;
    }

    .arched{
      width: min(560px, 100%);
      height: 120px;
      margin: -10px auto 0;
      display:block;
    }
    .arched text{
      font-family:"Uncial Antiqua", serif;
      font-size: 34px;
      fill: var(--forest);
      letter-spacing: 1.4px;
    }
    .arched .glow{
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.14));
    }

    .copy{ color: var(--muted); font-size: 1.05rem; margin-top:-6px; }

    label{ display:block; margin-top: 1rem; font-weight:900; color: var(--deep); }
    input, textarea{
      width:100%;
      margin-top:.45rem;
      padding: .95rem 1rem;
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,.14);
      background: rgba(255,255,255,.72);
      font-size: 1rem;
      outline: none;
    }
    textarea{ min-height: 150px; }

    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:.55rem;
      width:100%;
      margin-top: 1.2rem;
      padding: 1rem 1.2rem;
      border-radius: 999px;
      text-decoration:none;
      font-weight:900;
      border:1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, var(--moss), #4c735a);
      color:#fff;
      box-shadow: 0 16px 32px rgba(0,0,0,.10);
      cursor:pointer;
    }

    .emailLine{
      margin-top: 1rem;
      font-family:"Fondamento", cursive;
      font-size: 1.25rem;
      color: var(--deep);
    }

    footer{
      text-align:center;
      padding: 2rem 1rem 2.6rem;
      opacity:.82;
      font-size:.95rem;
      font-family:"Fondamento", cursive;
      position:relative;
      z-index:1;
    }
  </style>
</head>

<body>
  <div class="magicOverlay" aria-hidden="true"></div>

  <div class="nav">
    <div class="brand"><span class="orb" aria-hidden="true"></span> The Storybook Play Cafe</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="booking.html">Booking</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <div class="wrap">
    <section class="pageHero">
      <h1 class="pageTitle">Contact</h1>
      <p class="subtitle">Send a little message spell… we’ll reply as soon as we can.</p>
    </section>

    <section class="card">
      <svg class="arched" viewBox="0 0 500 120" aria-label="Send us a message">
        <path id="curveC1" d="M 50 90 Q 250 10 450 90" fill="transparent"></path>
        <text class="glow">
          <textPath href="#curveC1" startOffset="50%" text-anchor="middle">
            Send a Message 🧚
          </textPath>
        </text>
      </svg>

      <p class="copy">
        If you’d like updates, have a question, or want to say hello — pop us a message below.
      </p>

      <!-- Form action can be connected later (Formspree). For now it won't deliver anywhere. -->
      <form action="#" method="POST" onsubmit="alert('This form is not connected yet. For now, please email us.'); return false;">
        <label>Your name</label>
        <input name="name" required />

        <label>Email</label>
        <input type="email" name="email" required />

        <label>Message</label>
        <textarea name="message" required></textarea>

        <button class="btn" type="submit">Send message ✨</button>
      </form>

      <div class="emailLine">
        Or email us: <strong>thestorybookplaycafe@outlook.com</strong>
      </div>
    </section>
  </div>

  <footer>© The Storybook Play Cafe</footer>
</body>
</html>
